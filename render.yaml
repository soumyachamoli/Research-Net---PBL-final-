services:
  - type: web
    name: researchnet
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: DB_POOL_SIZE
        value: "4"
      - key: RELOAD_SECONDS
        value: "120"
